name: Venyl UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin-only sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('public/index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'id="venylAdminSidebarFix"'
          if marker not in s:
              fix = r'''<script id="venylAdminSidebarFix">
              (() => {
                const apply = () => {
                  const sections = [...document.querySelectorAll('.nav-section')];
                  const target = sections.find(el => /Управление|Manage|Hantera|Керування/i.test(el.innerText || ''));
                  if (!target) return;
                  target.style.display = 'none';
                  fetch('/api/auth/me', { credentials: 'same-origin' })
                    .then(r => r.ok ? r.json() : { user: null })
                    .then(({ user }) => {
                      const admin = user && (user.isAdmin === true || String(user.role || '').toLowerCase() === 'admin');
                      if (admin) target.style.display = '';
                    })
                    .catch(() => {});
                };
                if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply, { once: true });
                else apply();
              })();
              </script>'''
              s = s.replace('</body>', fix + '\n</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit UI fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix admin-only sidebar [skip ci]"
          git push
